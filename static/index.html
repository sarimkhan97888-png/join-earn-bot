<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>Profitix Ghost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#060912;--card:#0E1424;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--txt:#F8FAFC;--mut:#94A3B8;--mut2:#64748B;--ind:#6366F1;--vio:#8B5CF6;--cyan:#38BDF8;--em:#10B981;--rose:#FB7185;--amber:#FBBF24;--grad:linear-gradient(135deg,#6366F1 0%,#8B5CF6 55%,#C084FC 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.mono{font-family:'JetBrains Mono',monospace}.mut{color:var(--mut)}
#aurora{position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 18% 12%,rgba(99,102,241,.2),transparent 70%),radial-gradient(34% 30% at 88% 28%,rgba(56,189,248,.11),transparent 70%),radial-gradient(40% 34% at 55% 96%,rgba(192,132,252,.15),transparent 70%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.1)}}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)}
.pad{padding:16px}
.tab{display:none}.tab.on{display:block;animation:fade .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.t{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.lbl{font:700 11px 'Plus Jakarta Sans';letter-spacing:.09em;color:var(--mut);text-transform:uppercase;margin:0 0 10px}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(60% 42% at 50% 36%,rgba(99,102,241,.26),transparent 70%),var(--bg);transition:opacity .55s,transform .55s}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.gh{filter:drop-shadow(0 0 26px rgba(139,92,246,.75));animation:float 2.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.gh .eye{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.gsh{width:72px;height:10px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(7px);margin-top:12px;animation:gs 2.8s ease-in-out infinite}
@keyframes gs{50%{transform:scale(.65);opacity:.45}}
.brand{margin-top:24px;font:800 28px 'Plus Jakarta Sans';letter-spacing:-.03em}.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{width:160px;height:4px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:26px}
.bar i{display:block;height:100%;width:42%;border-radius:9px;background:var(--grad);animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
#tip{margin-top:16px;color:var(--mut);font-size:13px;min-height:18px;transition:opacity .25s}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shm 1.3s infinite;border-radius:16px}
@keyframes shm{to{background-position:-200% 0}}
/* ---------- controls ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:15px;padding:14px 16px;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#fff;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.5;pointer-events:none}
.btn-p{background:var(--grad);box-shadow:0 10px 26px rgba(99,102,241,.4)}
.btn-g{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn-d{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);color:#FDA4AF}
.btn-s{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:13px 14px;color:var(--txt);font:500 15px 'Plus Jakarta Sans',sans-serif;outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--ind);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
select.inp{appearance:none}textarea.inp{resize:none;min-height:88px;line-height:1.5}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:600 13px 'Plus Jakarta Sans';color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(99,102,241,.38)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 10px 'Plus Jakarta Sans';letter-spacing:.06em;white-space:nowrap}
.pill-pro{background:rgba(139,92,246,.18);color:#C4B5FD;border:1px solid rgba(139,92,246,.4)}
.pill-ok{background:rgba(16,185,129,.14);color:#6EE7B7;border:1px solid rgba(16,185,129,.35)}
.pill-bad{background:rgba(251,113,133,.12);color:#FDA4AF;border:1px solid rgba(251,113,133,.3)}
.pill-warn{background:rgba(251,191,36,.13);color:#FCD34D;border:1px solid rgba(251,191,36,.33)}
.dot{width:10px;height:10px;border-radius:50%;position:relative;background:var(--mut2);flex:none}
.dot.on{background:var(--em)}.dot.on::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--em);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.9);opacity:0}}
.sw{width:58px;height:32px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;border:0;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--em);box-shadow:0 0 18px rgba(16,185,129,.45)}.sw.on::after{transform:translateX(26px)}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 8px;border-radius:11px;font:700 13px 'Plus Jakarta Sans';cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.38)}
#nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(93vw,27rem);display:flex;padding:7px;gap:3px;border-radius:24px;background:rgba(14,20,36,.84);border:1px solid var(--line2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 16px 44px rgba(0,0,0,.55);z-index:30}
#nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 0 7px;border-radius:17px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10.5px 'Plus Jakarta Sans';cursor:pointer;transition:all .25s}
#nav button.on{color:#fff;background:var(--grad);box-shadow:0 6px 20px rgba(99,102,241,.45)}
.bd{position:fixed;inset:0;background:rgba(2,6,14,.64);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}.bd.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:28rem;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.25,1);z-index:50;background:rgba(14,20,36,.98);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.price-card{position:relative;padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s}.price-card:active{transform:scale(.985)}
.price-card.pro{border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:0 14px 44px rgba(99,102,241,.28)}
.badge{position:absolute;top:-11px;right:16px;padding:5px 11px;border-radius:999px;font:800 10px 'Plus Jakarta Sans';letter-spacing:.06em;color:#fff;background:var(--grad);box-shadow:0 4px 14px rgba(99,102,241,.5)}
.badge.save{right:auto;left:16px;background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.4)}
.shine{position:relative;overflow:hidden}.shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.feat{display:flex;gap:9px;align-items:center;font-size:13px;color:#CBD5E1;margin:7px 0}.feat svg{color:var(--em);flex:none}.feat.no{color:#64748B;text-decoration:line-through}.feat.no svg{color:#64748B}
.qr{background:#fff;border-radius:18px;padding:10px;width:178px;height:178px;margin:0 auto}.qr img{width:100%;height:100%;display:block}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--ind);animation:rot .8s linear infinite;margin:0 auto}@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:78px;height:78px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 0 50px rgba(99,102,241,.6)}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:90;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);background:rgba(14,20,36,.96);border:1px solid var(--line2);padding:11px 16px;border-radius:14px;font:600 13px 'Plus Jakarta Sans';z-index:120;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:90vw;text-align:center}#toast.on{transform:translate(-50%,0)}
.faq{border-bottom:1px solid var(--line)}.faq:last-child{border:0}
.faq button{width:100%;display:flex;justify-content:space-between;gap:10px;background:none;border:0;color:var(--txt);padding:14px 0;font:600 14px 'Plus Jakarta Sans';text-align:left;cursor:pointer}
.faq .a{max-height:0;overflow:hidden;color:var(--mut);font-size:13px;line-height:1.6;transition:max-height .3s ease}.faq.on .a{max-height:170px;padding-bottom:14px}.faq.on svg{transform:rotate(180deg)}.faq svg{transition:transform .25s;flex:none}
table.mx{width:100%;border-collapse:collapse;font-size:12.5px}table.mx td,table.mx th{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line)}table.mx td:first-child,table.mx th:first-child{text-align:left;color:#CBD5E1}table.mx tr:last-child td{border:0}
.err{color:#FDA4AF;font-size:13px;margin-top:10px;line-height:1.5}.hide{display:none!important}
/* ---------- home hero ---------- */
.hero{position:relative;overflow:hidden}.hero.live{border-color:rgba(16,185,129,.32);box-shadow:0 0 46px rgba(16,185,129,.14),0 12px 34px rgba(0,0,0,.28)}
.hg{width:54px;height:58px;flex:none;filter:drop-shadow(0 0 14px rgba(139,92,246,.6))}.hero.live .hg{animation:float 2.8s ease-in-out infinite}.hero:not(.live) .hg{filter:grayscale(1) opacity(.55)}
.hn{font:800 30px 'Plus Jakarta Sans';letter-spacing:-.02em}
/* ---------- admin ---------- */
.kpi{padding:14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card);border:1px solid var(--line)}
.kpi .kl{font:700 10.5px 'Plus Jakarta Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kpi .kv{font:800 28px 'Plus Jakarta Sans';letter-spacing:-.02em;margin-top:4px}.kpi .ks{font-size:11.5px;color:var(--mut2);margin-top:2px}
.kpi.em .kv{color:var(--em)}.kpi.cy .kv{color:var(--cyan)}.kpi.vi .kv{color:#C4B5FD}.kpi.am .kv{color:var(--amber)}.kpi.ro .kv{color:var(--rose)}
.fr{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.fr:last-child{border:0}
.fr.fresh{animation:fresh 1.6s ease-out}@keyframes fresh{from{background:rgba(99,102,241,.22)}to{background:transparent}}
.fi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none;background:rgba(255,255,255,.05)}
.c-em .fi{background:rgba(16,185,129,.15)}.c-rose .fi{background:rgba(251,113,133,.14)}.c-amb .fi{background:rgba(251,191,36,.14)}.c-vio .fi{background:rgba(139,92,246,.18)}.c-cyan .fi{background:rgba(56,189,248,.14)}
.fb{min-width:0;font-size:13.5px;line-height:1.45}.ft{font-size:11px;color:var(--mut2);margin-top:2px}
.bar2{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:9px;background:var(--grad)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--em);animation:ring2 1.4s infinite}@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}100%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
</style>
</head>
<body>
<div id="aurora"></div>
<div id="toast"></div>

<div id="splash">
  <svg class="gh" width="112" height="120" viewBox="0 0 120 130" aria-hidden="true">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs>
    <path d="M60 8C34 8 16 28 16 54v58l14-10 15 12 15-12 15 12 15-12 14 10V54C104 28 86 8 60 8z" fill="url(#gg)"/>
    <ellipse class="eye" cx="46" cy="54" rx="7" ry="9" fill="#0B1020"/><ellipse class="eye" cx="74" cy="54" rx="7" ry="9" fill="#0B1020"/>
    <path d="M52 76q8 7 16 0" stroke="#0B1020" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="gsh"></div>
  <div class="brand">Profitix <b>Ghost</b></div>
  <div class="bar"><i></i></div>
  <div id="tip">Waking up your Ghost...</div>
</div>

<main id="app" class="mx-auto px-4" style="max-width:28rem;padding-bottom:130px;padding-top:calc(20px + env(safe-area-inset-top))">
  <section id="tab-home" class="tab on"></section>
  <section id="tab-ghost" class="tab"></section>
  <section id="tab-plans" class="tab"></section>
  <section id="tab-profile" class="tab"></section>
  <section id="tab-admin" class="tab"></section>
</main>
<nav id="nav" class="hide"></nav>
<div id="bd" class="bd"></div>
<div id="sheet" class="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
/* ===================== Telegram + helpers ===================== */
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = (tg && tg.initData) || '';
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#060912'); tg.setBackgroundColor('#060912'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const H = {
  light: () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  sel: () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} },
  ok: () => { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
  err: () => { try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',
  ghost: '<path d="M12 2a7 7 0 0 0-7 7v12l3-2 2 2 2-2 2 2 2-2 3 2V9a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="1"/><circle cx="14.5" cy="10" r="1"/>',
  plans: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  admin: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  check: '<path d="M5 13l4 4L19 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  chev: '<path d="M6 9l6 6 6-6"/>', bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  tg: '<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/>', wa: '<path d="M21 12a9 9 0 1 1-4-7.5L21 4l-1.5 4A9 9 0 0 1 21 12z"/>',
  hook: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const ic = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const GHOST = c => `<svg class="${c}" viewBox="0 0 120 130"><defs><linearGradient id="hg${c}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs><path d="M60 8C34 8 16 28 16 54v58l14-10 15 12 15-12 15 12 15-12 14 10V54C104 28 86 8 60 8z" fill="url(#hg${c})"/><ellipse cx="46" cy="54" rx="7" ry="9" fill="#0B1020"/><ellipse cx="74" cy="54" rx="7" ry="9" fill="#0B1020"/><path d="M52 76q8 7 16 0" stroke="#0B1020" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
const skel = (n = 3) => Array.from({ length: n }, () => '<div class="sk" style="height:84px;margin-top:12px"></div>').join('');
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800); }
async function api(path, body) {
  const o = { headers: { 'X-Telegram-Init-Data': INIT } };
  if (body !== undefined) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  let r; try { r = await fetch(path, o); } catch (e) { return { status: 'error', error: 'Network error. Check your connection.', _ok: false }; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  j._ok = r.ok; return j;
}
function copy(text, label) {
  const done = () => { H.ok(); toast((label || 'Copied') + ' copied'); };
  const fb = () => { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed'); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fb); else fb();
}
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
function ago(iso) { if (!iso) return '-'; const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000); if (s < 10) return 'just now'; if (s < 60) return Math.floor(s) + 's ago'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
const TIER = { trial: '1-DAY TRIAL', starter: 'STARTER', pro: 'PRO', none: 'FREE' };
const mb = {

async function adminLoad() {
  if (A.busy) return; A.busy = true;
  try {
    if (A.sub === 'overview') { const r = await api('/api/admin/overview'); if (r._ok) A.ov = r; }
    else if (A.sub === 'live') await loadFeed(!A.feed.length);
    else if (A.sub === 'users') { A.upage = 0; const r = await api('/api/admin/users?q=' + encodeURIComponent(A.uq) + '&offset=0'); if (r._ok) A.users = r; }
    else { const r = await api('/api/admin/payments'); if (r._ok) A.pays = r.payments; }
  } finally { A.busy = false; }
  if (U.tab === 'admin') renderAdmin();
}
async function loadFeed(initial) {
  const r = await api('/api/admin/feed?after=' + (initial ? 0 : A.lastId) + '&limit=' + (initial ? 60 : 40)); if (!r._ok) return;
  const ev = r.events || []; if (!ev.length) return;
  A.fresh = initial ? new Set() : new Set(ev.map(e => e.id));
  A.feed = initial ? ev : ev.concat(A.feed).slice(0, 150);
  A.lastId = Math.max(A.lastId, ...ev.map(e => e.id));
}
function startAdmin() {
  adminLoad(); clearInterval(A.timer);
  A.timer = setInterval(() => {
    if (document.hidden || U.tab !== 'admin') return; A.n++;
    if (A.sub === 'live') adminLoad(); else if (A.sub === 'overview' && A.n % 3 === 0) adminLoad(); else if (A.sub === 'payments' && A.n % 4 === 0) adminLoad();
  }, 4000);
}
async function moreUsers() {
  A.upage++; const r = await api('/api/admin/users?q=' + encodeURIComponent(A.uq) + '&offset=' + (A.upage * 30));
  if (r._ok) { A.users.users = A.users.users.concat(r.users); A.users.total = r.total; renderAdmin(); }
}

/* ===================== WHATSAPP + WEBHOOKS (Pro) ===================== */
async function ensurePlatformData() {
  if (W.loading) return; W.loading = true;
  const r = await api('/api/integrations'); W.loading = false; W.loaded = true;
  if (r._ok) { W.wa = r.whatsapp; W.hook = r.webhook; W.engine = r.engine_online; if (!W.hd || !W.hd.dirty) W.hd = { url: r.webhook.url || '', enabled: !!r.webhook.enabled, reply: !!r.webhook.reply, dirty: false }; }
  else toast(r.error || 'Could not load');
  if (U.tab === 'ghost' && U.platform !== 'telegram') renderGhost();
}
function startWaPoll() {
  clearInterval(W.timer);
  W.timer = setInterval(async () => {
    if (U.tab !== 'ghost' || U.platform !== 'whatsapp') { clearInterval(W.timer); W.timer = null; return; }
    const r = await api('/api/whatsapp/status'); if (!r._ok) return;
    const was = W.wa ? W.wa.status : ''; W.wa = r.whatsapp; W.engine = r.engine_online;
    if (W.wa.status === 'connected' && was !== 'connected') { H.ok(); toast('WhatsApp connected 🎉'); }
    if (W.wa.status !== 'pairing') { clearInterval(W.timer); W.timer = null; }
    renderGhost();
  }, 2500);
}
function waPanel() {

  let inner;
  if (s.status === 'connected') {
    inner = `<div class="flex items-center gap-3"><div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#10B981,#059669);display:grid;place-items:center">${ic('wa', 'w-6 h-6')}</div><div style="flex:1;min-width:0"><div style="font-weight:800">${esc(s.wa_name || 'WhatsApp')}</div><div class="mut mono" style="font-size:12px">+${esc(s.wa_number || '')}</div></div><span class="pill pill-ok">LIVE</span></div>
    <p class="mut" style="font-size:12.5px;line-height:1.6;margin:14px 0 0">Ghost answers your WhatsApp chats with the same reply, rules, cooldown and Smart mode you set in the Telegram tab. Groups and broadcasts are ignored.</p>
    <button class="btn btn-d mt-3" data-act="wadisc">Disconnect WhatsApp</button>`;
  } else if (s.status === 'pairing') {
    inner = s.pairing_code
      ? `<p class="lbl">Your pairing code</p><div class="mono" style="font-size:34px;font-weight:700;letter-spacing:.12em;text-align:center;padding:16px 0;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line2)">${esc(String(s.pairing_code).replace(/(.{4})(?=.)/g, '$1-'))}</div>
        <ol class="mut" style="font-size:13px;line-height:1.8;margin:14px 0 0;padding-left:18px"><li>Open <b style="color:#E2E8F0">WhatsApp</b> on your phone</li><li>Settings → <b style="color:#E2E8F0">Linked devices</b> → Link a device</li><li>Tap <b style="color:#E2E8F0">Link with phone number instead</b></li><li>Enter the code above</li></ol>
        <div class="flex items-center gap-2 mut mt-3" style="font-size:12px"><span class="livedot"></span>Waiting for you to confirm on your phone...</div>
        <button class="btn btn-g mt-3" data-act="wadisc">Cancel</button>`
      : `<div style="text-align:center;padding:26px 0"><div class="spin"></div><p class="mut" style="font-size:13px;margin:16px 0 0">Generating your pairing code...</p></div><button class="btn btn-g" data-act="wadisc">Cancel</button>`;
  } else {
    inner = `<p class="lbl">Link your WhatsApp</p><p class="mut" style="font-size:13px;line-height:1.6;margin:0 0 12px">Enter the number of the WhatsApp account you want Ghost to answer for. You will confirm with a code on your phone, no QR scan needed.</p>
      <div class="flex gap-2"><select id="wcc" class="inp" style="width:44%">${COUNTRIES.map(c => `<option value="${c[1]}" ${c[1] === W.cc ? 'selected' : ''}>${c[0]} ${c[1]}</option>`).join('')}</select><input id="wph" class="inp mono" inputmode="tel" placeholder="98765 43210" value="${esc(W.phone)}"></div>
      <button class="btn btn-p mt-3" data-act="wapair" ${W.busy ? 'disabled' : ''}>${W.busy ? 'Requesting...' : 'Get pairing code'}</button>
      ${(W.err || s.error) ? `<div class="err">${esc(W.err || s.error)}</div>` : ''}
      <p class="mut" style="font-size:11.5px;line-height:1.6;margin:14px 0 0">⚠️ Uses WhatsApp's unofficial linked-device protocol. Automation can put an account at risk of restrictions, so avoid spamming and prefer a number you can afford to lose.</p>`;
  }
  return off + `<div class="glass pad">${inner}</div>`;
}
async function waPair() {
  if (W.busy) return; const raw = (W.phone || '').trim(); const phone = raw.startsWith('+') ? raw : W.cc + raw.replace(/\D/g, '').replace(/^0+/, '');
  if (phone.replace(/\D/g, '').length < 8) { W.err = 'Enter a valid number.'; return renderGhost(); }
  W.busy = true; W.err = ''; renderGhost();
  const r = await api('/api/whatsapp/pair', { phone }); W.busy = false;
  if (r._ok) { W.wa = { status: 'pairing', pairing_code: null }; W.engine = r.engine_online; H.ok(); renderGhost(); startWaPoll(); }
  else { W.err = r.error || 'Could not start pairing.'; H.err(); if (r.code === 'pro_required') go('plans'); renderGhost(); }
}
async function waDisconnect() {
  const run = async () => { const r = await api('/api/whatsapp/disconnect', {}); if (r._ok) { W.wa = { status: 'none' }; clearInterval(W.timer); W.timer = null; H.ok(); toast('WhatsApp disconnected'); renderGhost(); } else toast(r.error || 'Failed'); };
  if (tg && tg.showConfirm) tg.showConfirm('Disconnect WhatsApp? Auto-reply on WhatsApp will stop.', ok => ok && run()); else if (confirm('Disconnect WhatsApp?')) run();
}
function hookPanel() {
  if (!W.loaded) return skel(2);
  const h = W.hook || {}, d = W.hd || { url: '', enabled: false, reply: false }, t = W.test;
  const stat = h.last_at ? `Last: ${h.last_status ? 'HTTP ' + h.last_status : esc(h.last_error || 'error')} · ${ago(h.last_at)}` : 'No deliveries yet';
  return `
  <div class="glass pad"><div class="flex items-center gap-3"><div style="font-size:26px">🔗</div><div style="flex:1"><div style="font-weight:800;font-size:15px">Webhook</div><div class="mut" style="font-size:12.5px;line-height:1.5;margin-top:2px">Every new message is sent as signed JSON to your server, n8n, Zapier or Make.</div></div><button class="sw ${d.enabled ? 'on' : ''}" data-act="hooktoggle" aria-label="Webhook"></button></div>
    <p class="lbl" style="margin-top:16px">Endpoint URL</p><input id="hurl" class="inp mono" style="font-size:13px" inputmode="url" placeholder="https://example.com/ghost-hook" value="${esc(d.url)}">
    <div class="flex items-center gap-3 mt-4"><div style="flex:1"><div style="font-weight:700;font-size:14px">Let my webhook decide the reply</div><div class="mut" style="font-size:12px;line-height:1.5;margin-top:2px">Answer with {"reply":"..."} to send that text, or {"skip":true} to stay silent. Perfect for AI bots.</div></div><button class="sw ${d.reply ? 'on' : ''}" data-act="hookreply" aria-label="Webhook reply"></button></div>
    ${h.secret ? `<p class="lbl" style="margin-top:16px">Signing secret</p><div class="flex items-center gap-2" style="padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line)"><div class="mono" style="flex:1;min-width:0;font-size:11px;word-break:break-all">${esc(h.secret)}</div><button class="btn btn-g btn-s" data-act="copy" data-v="${esc(h.secret)}" data-l="Secret">${ic('copy', 'w-4 h-4')}</button><button class="btn btn-g btn-s" data-act="hookrotate">New</button></div>` : '<p class="mut" style="font-size:12px;margin:14px 0 0">A signing secret is created when you save.</p>'}
    <button id="hookSave" class="btn btn-p mt-4" data-act="hooksave" ${W.saving ? 'disabled' : ''}>${W.saving ? 'Saving...' : 'Save webhook'}</button>
    <button class="btn btn-g mt-2" data-act="hooktest" ${h.url ? '' : 'disabled'}>Send test event</button>
    ${t ? `<div class="${t.ok ? '' : 'err'}" style="font-size:13px;margin-top:10px;line-height:1.5;${t.ok ? 'color:#6EE7B7' : ''}">${t.ok ? '✅ Delivered (HTTP ' + t.http_status + ')' + (t.reply ? ' · reply: ' + esc(t.reply) : '') : '❌ ' + esc(t.error || 'Failed')}</div>` : ''}
    <div class="flex gap-4 mut mt-4" style="font-size:12px"><span>✅ ${Number(h.delivered || 0).toLocaleString()} delivered</span><span>❌ ${Number(h.failed || 0).toLocaleString()} failed</span></div><div class="mut" style="font-size:11.5px;margin-top:4px">${stat}</div>
  </div>
  <div class="glass pad mt-3"><p class="lbl">Payload</p><pre class="mono" style="font-size:11px;line-height:1.55;margin:0;overflow-x:auto;color:#CBD5E1">{

            "username": "sam" }
}</pre><p class="mut" style="font-size:12px;line-height:1.6;margin:12px 0 0">Header <span class="mono">X-Ghost-Signature: sha256=&lt;HMAC-SHA256(secret, raw body)&gt;</span>. Only public https endpoints are allowed.</p></div>`;

async function hookSave(rotate) {
  if (W.saving || !W.hd) return; const d = W.hd;
  W.saving = true; renderGhost();
  const r = await api('/api/integrations/webhook', { url: d.url, enabled: d.enabled, reply: d.reply, rotate: !!rotate }); W.saving = false;
  if (r._ok) { W.hook = r.webhook; W.hd = { url: r.webhook.url, enabled: r.webhook.enabled, reply: r.webhook.reply, dirty: false }; W.test = null; H.ok(); toast(rotate ? 'New secret created' : 'Webhook saved ✓'); }
  else { H.err(); toast(r.error || 'Could not save'); if (r.code === 'pro_required') go('plans'); }
  renderGhost();
}
async function hookTest() {
  W.test = null; toast('Sending test event...');
  const r = await api('/api/integrations/webhook/test', {});
  W.test = r._ok ? { ok: r.ok, http_status: r.http_status, error: r.error, reply: r.reply } : { ok: false, error: r.error || 'Failed' };
  if (W.test.ok) H.ok(); else H.err();
  const h = await api('/api/integrations'); if (h._ok) W.hook = h.webhook;
  renderGhost();
}

/* ===================== Events ===================== */
const ACTIONS = {
  go: el => { H.sel(); go(el.dataset.t); },
  retry: () => location.reload(),
  master: toggleMaster,
  smart: () => { const d = ensureDraft(); d.only_when_offline = !d.only_when_offline; H.sel(); markDirty(); renderGhost(); },
  platform: el => { const p = el.dataset.p; H.sel(); if (p !== 'telegram' && !S.features.whatsapp) return openUpgrade(); U.platform = p; if (p !== 'telegram') W.loaded = false; clearInterval(W.timer); W.timer = null; renderGhost(); },
  toplans: () => { closeSheet(); go('plans'); },
  closesheet: closeSheet,
  paydone: () => { closeSheet(); go(S.account ? 'home' : 'ghost'); },
  tpl: el => { const d = ensureDraft(), k = el.dataset.k; d.template = k; if (TEMPLATES[k]) d.default_reply = TEMPLATES[k]; H.sel(); markDirty(); renderGhost(); },
  cool: el => { ensureDraft().cooldown_seconds = +el.dataset.c; H.sel(); markDirty(); renderGhost(); },
  addrule: () => { const d = ensureDraft(); if (d.keyword_rules.length >= S.max_rules) { H.err(); toast(S.features.whatsapp ? 'Rule limit reached' : `Starter allows ${S.max_rules} rules. Upgrade to Pro for unlimited.`); return; } d.keyword_rules.push({ keyword: '', reply: '' }); H.light(); markDirty(); renderGhost(); },
  delrule: el => { ensureDraft().keyword_rules.splice(+el.dataset.i, 1); H.light(); markDirty(); renderGhost(); },
  save: saveSettings, sendcode: () => sendCode(false), resend: () => sendCode(true), verifycode: verifyCode, verify2fa: verify2fa,
  editphone: () => { clearInterval(wizTimer); Object.assign(U.wiz, { step: 'phone', err: '', code: '' }); renderGhost(); },
  disconnect: () => { const run = async () => { const r = await api('/api/telegram/disconnect', {}); if (r._ok) { H.ok(); toast('Account disconnected'); await loadState(); } else toast(r.error || 'Failed'); }; if (tg && tg.showConfirm) tg.showConfirm('Disconnect this Telegram account? Auto-reply will stop.', ok => ok && run()); else if (confirm('Disconnect this account?')) run(); },
  bill: el => { U.billing = el.dataset.b; H.sel(); renderPlans(); },
  pay: el => openPay(el.dataset.k),
  method: el => { if (!P) return; P.method = el.dataset.m; P.err = ''; H.sel(); renderPay(); loadPayInfo(); },
  verify: doVerify, copy: el => copy(el.dataset.v, el.dataset.l),
  faq: el => { const n = +el.dataset.n; U.faq = U.faq === n ? -1 : n; H.light(); renderProfile(); },
  support: () => { const url = 'https://t.me/' + S.support; if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); },
  wapair: waPair, wadisc: waDisconnect,
  hooktoggle: () => { if (!W.hd) return; W.hd.enabled = !W.hd.enabled; W.hd.dirty = true; H.sel(); renderGhost(); },
  hookreply: () => { if (!W.hd) return; W.hd.reply = !W.hd.reply; W.hd.dirty = true; H.sel(); renderGhost(); },
  hooksave: () => hookSave(false), hookrotate: () => hookSave(true), hooktest: hookTest,
  asub: el => { A.sub = el.dataset.s; H.sel(); renderAdmin(); adminLoad(); },
  moreusers: moreUsers
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; if (el.tagName === 'A') { H.light(); return; } const f = ACTIONS[el.dataset.act]; if (f) f(el); });
let uqT = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ph') U.wiz.phone = t.value;
  else if (t.id === 'cd') { U.wiz.code = t.value.replace(/\D/g, ''); t.value = U.wiz.code; if (U.wiz.code.length === 5 && !U.wiz.busy) verifyCode(); }
  else if (t.id === 'pw') U.wiz.pw = t.value;
  else if (t.id === 'dr') { const d = ensureDraft(); d.default_reply = t.value; d.template = 'custom'; markDirty(); }
  else if (t.dataset && t.dataset.rk !== undefined) { ensureDraft().keyword_rules[+t.dataset.rk].keyword = t.value; markDirty(); }
  else if (t.dataset && t.dataset.rr !== undefined) { ensureDraft().keyword_rules[+t.dataset.rr].reply = t.value; markDirty(); }
  else if (t.id === 'utr' && P) { P.utr = t.value.replace(/\D/g, ''); t.value = P.utr; }
  else if (t.id === 'txh' && P) P.tx = t.value.trim();
  else if (t.id === 'wph') W.phone = t.value;
  else if (t.id === 'hurl' && W.hd) { W.hd.url = t.value; W.hd.dirty = true; }
  else if (t.id === 'uq') { A.uq = t.value.trim(); clearTimeout(uqT); uqT = setTimeout(async () => { const r = await api('/api/admin/users?q=' + encodeURIComponent(A.uq) + '&offset=0'); if (r._ok) { A.users = r; A.upage = 0; const box = $('#uq'); const pos = box ? box.selectionStart : 0; document.activeElement && document.activeElement.blur(); renderAdmin(); const nb = $('#uq'); if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (x) {} } } }, 350); }
});
document.addEventListener('change', e => { if (e.target.id === 'cc') U.wiz.cc = e.target.value; if (e.target.id === 'wcc') W.cc = e.target.value; });
$('#bd').addEventListener('click', closeSheet);

/* ===================== Boot ===================== */
(async function () {
  if (!INIT) return showFatal('');
  const q = new URLSearchParams(location.search).get('tab');
  const ok = await loadState(true);
  if (!ok) return;
  if (['home', 'ghost', 'plans', 'profile'].includes(q) || (q === 'admin' && S.is_admin)) U.tab = q;
  go(U.tab); hideSplash();
})();
