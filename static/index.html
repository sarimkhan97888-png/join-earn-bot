<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080D">
<title>Profitix Ghost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#05080D;
  --card:#0B111A;
  --line:rgba(255,255,255,.08);
  --txt:#F8FAFC;
  --mut:#8E9BAE;
  --acc:#00E5A8;
  --acc2:#00B4D8;
  --cyan:#38BDF8;
  --em:#10B981;
  --rose:#F43F5E;
  --amber:#F59E0B;
  --grad:linear-gradient(135deg,#00E5A8 0%,#00B4D8 100%);
  --acc-txt:#03120E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.mono{font-family:'JetBrains Mono',monospace}
#aurora{position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(45% 35% at 20% 12%,rgba(0,229,168,.11),transparent 70%),radial-gradient(40% 30% at 85% 28%,rgba(0,180,216,.09),transparent 70%),radial-gradient(45% 35% at 50% 95%,rgba(16,185,129,.08),transparent 70%)}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px}
.mut{color:var(--mut)}
.tab{display:none}.tab.on{display:block;animation:fade .2s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;font:800 15px 'Plus Jakarta Sans',sans-serif;color:#fff;cursor:pointer;text-decoration:none;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.5;pointer-events:none}
.btn-p{background:var(--grad);color:var(--acc-txt);box-shadow:0 8px 24px rgba(0,229,168,.25)}
.btn-g{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt)}
.btn-d{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#FDA4AF}
.btn-s{width:auto;padding:9px 14px;font-size:13px;border-radius:11px}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--txt);font:500 15px 'Plus Jakarta Sans',sans-serif;outline:none;transition:border .15s}
.inp:focus{border-color:var(--acc)}
select.inp{appearance:none}
textarea.inp{resize:none;min-height:88px;line-height:1.5}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:700 13px 'Plus Jakarta Sans';color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--grad);color:var(--acc-txt);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:800 10px 'Plus Jakarta Sans';letter-spacing:.06em}
.pill-pro{background:rgba(0,229,168,.15);color:#5EEAD4;border:1px solid rgba(0,229,168,.4)}
.pill-ok{background:rgba(16,185,129,.14);color:#6EE7B7;border:1px solid rgba(16,185,129,.35)}
.pill-bad{background:rgba(244,63,94,.12);color:#FDA4AF;border:1px solid rgba(244,63,94,.3)}
.pill-warn{background:rgba(245,158,11,.14);color:#FCD34D;border:1px solid rgba(245,158,11,.35)}
.dot{width:10px;height:10px;border-radius:50%;position:relative;background:var(--mut)}
.dot.on{background:var(--acc)}
.sw{width:58px;height:32px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;border:0;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(26px)}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 8px;border-radius:10px;font:700 13px 'Plus Jakarta Sans';cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:var(--grad);color:var(--acc-txt)}
#nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,26rem);display:flex;padding:7px;gap:4px;border-radius:22px;background:rgba(11,17,26,.95);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:30}
#nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 0 7px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10.5px 'Plus Jakarta Sans';cursor:pointer}
#nav button.on{color:var(--acc-txt);background:var(--grad)}

/* Bulletproof Modal Overlay */
#payModal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center;background:rgba(2,5,10,.78)}
#payModal.open{display:flex !important}
#payBox{width:100%;max-width:28rem;max-height:92vh;overflow-y:auto;background:#0B111A;border:1px solid rgba(0,229,168,.28);border-bottom:0;border-radius:26px 26px 0 0;padding:12px 18px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -12px 48px rgba(0,0,0,.75);animation:slideUp .24s ease-out}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.22);margin:0 auto 14px}

.price-card{position:relative;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .12s}
.price-card:active{transform:scale(.985)}
.price-card.pro{border:1.5px solid rgba(0,229,168,.48);box-shadow:0 12px 36px rgba(0,229,168,.12)}
.badge{position:absolute;top:-11px;right:16px;padding:5px 11px;border-radius:999px;font:800 10px 'Plus Jakarta Sans';letter-spacing:.06em;color:var(--acc-txt);background:var(--grad)}
.badge.save{right:auto;left:16px;background:linear-gradient(135deg,#10B981,#059669);color:#fff}
.feat{display:flex;gap:9px;align-items:center;font-size:13px;color:#CBD5E1;margin:7px 0}
.feat svg{color:var(--acc);flex:none}.feat.no{color:#64748B;text-decoration:line-through}.feat.no svg{color:#64748B}
.qr{background:#fff;border-radius:16px;padding:10px;width:176px;height:176px;margin:0 auto;display:grid;place-items:center}.qr img{width:100%;height:100%;display:block;border-radius:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.ghost-loader{position:relative;width:84px;height:84px;margin:0 auto;display:grid;place-items:center}
.ghost-loader::after{content:'';position:absolute;inset:4px;border-radius:50%;border:2.5px solid transparent;border-top-color:#00E5A8;border-right-color:#00B4D8;animation:rot 1s linear infinite}
.ghost-float{position:relative;z-index:2;width:52px;height:52px;border-radius:18px;background:var(--grad);color:var(--acc-txt);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,229,168,.35)}
.okc{width:76px;height:76px;border-radius:50%;background:var(--grad);color:var(--acc-txt);display:grid;place-items:center;margin:0 auto;box-shadow:0 0 40px rgba(0,229,168,.4)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:10000;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);background:#0B111A;border:1px solid rgba(0,229,168,.35);padding:11px 16px;border-radius:14px;font:600 13px 'Plus Jakarta Sans';z-index:10001;transition:transform .25s ease;max-width:90vw;text-align:center}#toast.on{transform:translate(-50%,0)}
.faq{border-bottom:1px solid var(--line)}.faq:last-child{border:0}
.faq button{width:100%;display:flex;justify-content:space-between;gap:10px;background:none;border:0;color:var(--txt);padding:14px 0;font:600 14px 'Plus Jakarta Sans';text-align:left;cursor:pointer}
.faq .a{max-height:0;overflow:hidden;color:var(--mut);font-size:13px;line-height:1.6;transition:max-height .25s ease}.faq.on .a{max-height:160px;padding-bottom:14px}.faq.on svg{transform:rotate(180deg)}.faq svg{transition:transform .2s;flex:none}
table.mx{width:100%;border-collapse:collapse;font-size:12.5px}table.mx td,table.mx th{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line)}table.mx td:first-child,table.mx th:first-child{text-align:left;color:#CBD5E1}table.mx tr:last-child td{border:0}
.lbl{font:700 11px 'Plus Jakarta Sans';letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin:0 0 8px}
.err{color:#FDA4AF;font-size:13px;margin-top:10px;line-height:1.5}
.hide{display:none!important}
</style>
</head>
<body>
<div id="aurora"></div>
<div id="toast"></div>
<main id="app" class="mx-auto px-4 pt-5" style="max-width:28rem;padding-bottom:130px;padding-top:calc(20px + env(safe-area-inset-top))">
  <section id="tab-home" class="tab on"></section>
  <section id="tab-ghost" class="tab"></section>
  <section id="tab-plans" class="tab"></section>
  <section id="tab-profile" class="tab"></section>
  <section id="boot" class="glass pad" style="text-align:center;margin-top:26vh;padding:28px 18px">
    <div class="ghost-loader">
      <div class="ghost-float">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a7 7 0 0 0-7 7v12l3-2 2 2 2-2 2 2 2-2 3 2V9a7 7 0 0 0-7-7z"/>
          <circle cx="9.5" cy="10" r="1.2" fill="currentColor"/>
          <circle cx="14.5" cy="10" r="1.2" fill="currentColor"/>
        </svg>
      </div>
    </div>
    <h2 style="font-weight:800;font-size:17px;margin:16px 0 4px">Profitix Ghost</h2>
    <p class="mut" style="margin:0;font-size:13px">Waking up your Ghost...</p>
  </section>
</main>
<nav id="nav" class="hide"></nav>
<div id="payModal" onclick="if(event.target===this)closeSheet()">
  <div id="payBox">
    <div class="grab" onclick="closeSheet()"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = (tg && tg.initData) || '';
if (tg) {
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor('#05080D');
    tg.setBackgroundColor('#05080D');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  } catch (e) {}
}
const H = {
  light: () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  sel: () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} },
  ok: () => { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
  err: () => { try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const FALLBACK_PLANS = [
  { key: 'trial', tier: 'trial', period: 'day', name: '1-Day Starter Trial', inr: 2, usdt: null, days: 1, badge: '' },
  { key: 'starter_monthly', tier: 'starter', period: 'month', name: 'Starter Monthly', inr: 49, usdt: 1, days: 30, badge: '' },
  { key: 'starter_yearly', tier: 'starter', period: 'year', name: 'Starter Yearly', inr: 399, usdt: 8, days: 365, badge: 'SAVE 32%' },
  { key: 'pro_monthly', tier: 'pro', period: 'month', name: 'Pro Monthly', inr: 199, usdt: 3, days: 30, badge: '' },
  { key: 'pro_yearly', tier: 'pro', period: 'year', name: 'Pro Yearly', inr: 1499, usdt: 20, days: 365, badge: 'MOST POPULAR | SAVE 37%' }
];
const DEFAULT_USDT_WALLET = '0x8f61C470a4fC19f79685BB60F8c6e3676BCf886B';

const ICONS = {
  home: '<path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',
  ghost: '<path d="M12 2a7 7 0 0 0-7 7v12l3-2 2 2 2-2 2 2 2-2 3 2V9a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="1"/><circle cx="14.5" cy="10" r="1"/>',
  plans: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  check: '<path d="M5 13l4 4L19 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  chev: '<path d="M6 9l6 6 6-6"/>', bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  tg: '<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/>', wa: '<path d="M21 12a9 9 0 1 1-4-7.5L21 4l-1.5 4A9 9 0 0 1 21 12z"/>',
  hook: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const ic = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
function ghostLoaderHtml(text) {
  return `<div class="ghost-loader"><div class="ghost-float">${ic('ghost', 'w-7 h-7')}</div></div><p class="mut" style="margin:14px 0 0;font-size:13.5px">${esc(text || 'Loading...')}</p>`;
}
function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), 2800);
}
async function api(path, body, timeoutMs = 12000) {
  const o = { headers: { 'X-Telegram-Init-Data': INIT } };
  if (body !== undefined) {
    o.method = 'POST';
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(body);
  }
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
  if (ctrl) o.signal = ctrl.signal;
  let r;
  try {
    r = await fetch(path, o);
  } catch (e) {
    if (timer) clearTimeout(timer);
    return { status: 'error', error: e && e.name === 'AbortError' ? 'Server took too long. Try again.' : 'Network error. Check your connection.', _ok: false };
  }
  if (timer) clearTimeout(timer);
  let j = {};
  try { j = await r.json(); } catch (e) {}
  j._ok = r.ok;
  return j;
}
function copy(text, label) {
  if (!text) return toast('Nothing to copy');
  const done = () => { H.ok(); toast((label || 'Copied') + ' copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fb());
  else fb();
  function fb() {
    const a = document.createElement('textarea');
    a.value = text;
    document.body.appendChild(a);
    a.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed'); }
    a.remove();
  }
}
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const TIER = { trial: '1-DAY TRIAL', starter: 'STARTER', pro: 'PRO', none: 'FREE' };
const mb = {
  fn: null,
  set(t, f) { if (!tg) return; this.hide(); this.fn = f; tg.MainButton.setParams({ text: t, color: '#00E5A8', text_color: '#03120E' }); tg.MainButton.onClick(f); tg.MainButton.show(); },
  hide() { if (!tg) return; if (this.fn) tg.MainButton.offClick(this.fn); this.fn = null; tg.MainButton.hide(); }
};

let S = null;
const U = {
  tab: 'home', platform: 'telegram', billing: 'monthly', draft: null, dirty: false, history: null, faq: -1,
  wiz: { step: 'phone', cc: '+91', phone: '', code: '', pw: '', full: '', err: '', busy: false, resend: 0 }
};
let P = null, endTs = 0, wizTimer = null;
const COUNTRIES = [['🇮🇳 India', '+91'], ['🇺🇸 USA / Canada', '+1'], ['🇬🇧 UK', '+44'], ['🇦🇪 UAE', '+971'], ['🇸🇦 Saudi Arabia', '+966'], ['🇵🇰 Pakistan', '+92'], ['🇧🇩 Bangladesh', '+880'], ['🇳🇵 Nepal', '+977'], ['🇱🇰 Sri Lanka', '+94'], ['🇮🇩 Indonesia', '+62'], ['🇲🇾 Malaysia', '+60'], ['🇸🇬 Singapore', '+65'], ['🇳🇬 Nigeria', '+234'], ['🇿🇦 South Africa', '+27'], ['🇧🇷 Brazil', '+55'], ['🇷🇺 Russia', '+7'], ['🇹🇷 Turkey', '+90'], ['🇩🇪 Germany', '+49'], ['🇫🇷 France', '+33'], ['🇦🇺 Australia', '+61']];
const TEMPLATES = {
  busy: "Hi! I'm busy / away from my phone right now and will get back to you as soon as I can. 🙏",
  hours: "Thanks for your message! Our business hours are 10 AM - 7 PM, Monday to Saturday. I'll reply as soon as we're back.",
  sleep: "I'm sleeping right now 😴 I'll reply when I wake up. If it's urgent, please call me."
};
const FAQ = [
  ['Which code do I enter when connecting?', 'Telegram sends a 5-digit code to your official Telegram app chat (the chat named "Telegram"), not by SMS. Open that chat and type the code here.'],
  ['How does the ₹2 trial work?', 'You get 24 hours of Telegram auto-reply for ₹2 via UPI. It can be claimed once per Telegram user, once per payer UPI ID and once per connected Telegram account.'],
  ['My payment is not detected', 'Bank alerts can take 1-2 minutes. Make sure you paid the exact plan amount, typed the correct 12-digit UTR, and for USDT used the BEP20 (BNB Smart Chain) network with the exact amount.'],
  ['Will Ghost spam my contacts?', 'No. It replies once per contact within your cooldown (5m / 15m / 1h), and ignores groups, channels, bots and your own messages.'],
  ['How do I stop or remove it?', 'Use the master switch on Home to pause instantly, or press Disconnect in the Ghost tab to log the session out completely.']
];

async function loadState() {
  const r = await api('/api/state');
  if (!r._ok) { showFatal(r.error || 'Could not load your account.'); return false; }
  S = r;
  if (!Array.isArray(S.plans) || !S.plans.length) S.plans = FALLBACK_PLANS;
  endTs = Date.now() + ((S.status && S.status.seconds_left) || 0) * 1000;
  if (!U.dirty) U.draft = null;
  $('#boot').classList.add('hide');
  $('#nav').classList.remove('hide');
  renderAll();
  return true;
}
function showFatal(msg) {
  const inTg = !!INIT;
  $('#boot').innerHTML = `<div style="font-size:42px">👻</div><h2 style="font-weight:800;font-size:19px;margin:10px 0 6px">${inTg ? 'Something went wrong' : 'Open inside Telegram'}</h2><p class="mut" style="font-size:14px;line-height:1.6">${esc(inTg ? msg : 'Profitix Ghost is a Telegram Mini App. Open it from the bot using the Open Ghost button.')}</p>${inTg ? '<button class="btn btn-p" style="margin-top:18px" onclick="retryBoot()">Try again</button>' : ''}`;
  $('#boot').classList.remove('hide');
}
function retryBoot() {
  $('#boot').innerHTML = ghostLoaderHtml('Reconnecting your Ghost...');
  loadState();
}

const TABS = [['home', 'Home'], ['ghost', 'Ghost'], ['plans', 'Plans'], ['profile', 'Profile']];
function renderNav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${U.tab === k ? 'on' : ''}" onclick="go('${k}')">${ic(k, 'w-5 h-5')}<span>${l}</span></button>`).join('');
}
function go(t) {
  H.sel();
  U.tab = t;
  document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.id === 'tab-' + t));
  renderNav();
  renderTab(t);
  window.scrollTo({ top: 0 });
  if (t === 'ghost' && U.dirty) mb.set('Save Auto-Reply', saveSettings);
  else if (!P) mb.hide();
  if (t === 'profile' && U.history === null) loadHistory();
}
function renderAll() { renderNav(); renderTab(U.tab); }
function renderTab(t) { ({ home: renderHome, ghost: renderGhost, plans: renderPlans, profile: renderProfile })[t](); }

function cdText() {
  const ms = endTs - Date.now();
  if (!S || !S.status || S.status.status !== 'active' || ms <= 0) return '--';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0');
  return d > 0 ? `${d}d ${p(h)}h ${p(m)}m` : `${p(h)}:${p(m)}:${p(x)}`;
}
function renderHome() {

      usdt: { wallet: DEFAULT_USDT_WALLET, qr_svg: qrFallbackSrc(DEFAULT_USDT_WALLET) }
    },
    utr: '', tx: '', busy: false, err: '', done: null
  };
  renderPay();
  mb.set('Verify Payment', doVerify);
  await loadPayInfo();
}
async function loadPayInfo() {
  if (!P) return;
  const m = P.method;
  const r = await api(`/api/payment/info?plan_key=${encodeURIComponent(P.plan.key)}&method=${encodeURIComponent(m)}`, undefined, 8000);
  if (!P) return;
  if (r._ok) {
    P.info[m] = Object.assign({}, P.info[m] || {}, r);
    if (!P.info[m].qr_svg) {
      P.info[m].qr_svg = qrFallbackSrc(m === 'upi' ? (P.info[m].deep_link || P.info[m].upi_id) : P.info[m].wallet);
    }
    P.err = '';
  } else if (r.error) {
    P.err = r.error;
  }
  renderPay();
}
function renderPay() {
  if (!P) return;
  const p = P.plan, m = P.method, i = P.info[m] || {};
  if (P.busy) {
    openSheet(`<div style="text-align:center;padding:34px 0">${ghostLoaderHtml(m === 'upi' ? 'Checking your bank credit alert...' : 'Confirming on BNB Smart Chain...')}<p class="mut" style="font-size:12.5px;margin-top:6px">This can take up to 30 seconds.</p></div>`);
    return;
  }
  if (P.done) {
    openSheet(`<div style="text-align:center;padding:24px 0 8px"><div class="okc">${ic('check', 'w-10 h-10').replace('<svg', '<svg stroke-width="3"')}</div><h3 style="font-size:22px;font-weight:800;margin:20px 0 6px">Payment verified! 🎉</h3><p class="mut" style="font-size:14px;margin:0 0 4px">${esc(p.name)} is now active</p><p style="font-size:13px;margin:0 0 20px;color:var(--acc)" class="mono">Valid until ${esc(fmtDate(P.done))}</p><button class="btn btn-p" onclick="payDoneClick()">${S && S.account ? 'Back to Home' : 'Connect Telegram now'}</button></div>`);
    return;
  }
  const usdtOk = p.usdt != null, amt = m === 'upi' ? '₹' + p.inr.toLocaleString('en-IN') : p.usdt + ' USDT';
  const qrSrc = i.qr_svg || qrFallbackSrc(m === 'upi' ? (i.deep_link || i.upi_id || '') : (i.wallet || DEFAULT_USDT_WALLET));
  let body = '';
  if (m === 'upi') {
    const upiId = i.upi_id || 'profitix@upi';
    const deep = i.deep_link || `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent('Profitix Ghost')}&am=${p.inr}&cu=INR`;
    body = `<a class="btn btn-p" href="${esc(deep)}" onclick="H.light()">Open UPI App · ${amt}</a>
      <div class="mut" style="text-align:center;font-size:12px;margin:14px 0 10px">or scan with any UPI app</div>
      <div class="qr"><img alt="UPI QR" src="${esc(qrSrc)}" onerror="this.src='${esc(qrFallbackSrc(deep))}'"></div>
      <div class="flex items-center gap-2 mt-4" style="padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)"><div style="flex:1;min-width:0"><div class="lbl" style="margin:0 0 2px">UPI ID</div><div class="mono" style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis">${esc(upiId)}</div></div><button type="button" class="btn btn-g btn-s" onclick="copy('${esc(upiId)}','UPI ID')">${ic('copy', 'w-4 h-4')} Copy</button></div>
      <p class="lbl" style="margin-top:16px">After paying, enter the 12-digit UTR</p>
      <input id="utr" class="inp mono" inputmode="numeric" maxlength="12" placeholder="123456789012" value="${esc(P.utr)}">`;
  } else {
    const wallet = i.wallet || DEFAULT_USDT_WALLET;
    body = `<div class="qr"><img alt="USDT QR" src="${esc(qrSrc)}" onerror="this.src='${esc(qrFallbackSrc(wallet))}'"></div>
      <div class="flex items-center justify-between mt-4" style="padding:12px;border-radius:12px;background:rgba(0,229,168,.08);border:1px solid rgba(0,229,168,.25)"><span class="mut" style="font-size:13px">Send exactly</span><span class="mono" style="font-weight:700;color:var(--acc);font-size:16px">${p.usdt} USDT</span></div>
      <div class="mut" style="font-size:12px;margin:8px 0 0">Network: <b style="color:#E2E8F0">BEP20 (BNB Smart Chain)</b>. Other networks will be lost.</div>
      <div class="flex items-center gap-2 mt-3" style="padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)"><div style="flex:1;min-width:0"><div class="lbl" style="margin:0 0 2px">Wallet address</div><div class="mono" style="font-size:11px;word-break:break-all">${esc(wallet)}</div></div><button type="button" class="btn btn-g btn-s" onclick="copy('${esc(wallet)}','Address')">${ic('copy', 'w-4 h-4')} Copy</button></div>
      <p class="lbl" style="margin-top:16px">After sending, paste the TxHash</p>
      <input id="txh" class="inp mono" placeholder="0x..." style="font-size:12px" value="${esc(P.tx)}">`;
  }
  openSheet(`<div class="flex items-center justify-between mb-3"><div><div style="font-weight:800;font-size:19px">${esc(p.name)}</div><div class="mut" style="font-size:12.5px">${p.days === 1 ? '24 hours' : p.days + ' days'} access</div></div><div style="font-size:24px;font-weight:800;color:var(--acc)">${amt}</div></div>
  <div class="seg mb-4"><button type="button" class="${m === 'upi' ? 'on' : ''}" onclick="switchMethod('upi')">UPI</button>${usdtOk ? `<button type="button" class="${m === 'usdt' ? 'on' : ''}" onclick="switchMethod('usdt')">USDT BEP20</button>` : ''}</div>
  ${body}${P.err ? `<div class="err">${esc(P.err)}</div>` : ''}
  <button type="button" class="btn btn-p mt-4" onclick="doVerify()">Verify Payment</button><button type="button" class="btn btn-g mt-2" onclick="closeSheet()">Cancel</button>`);
}
async function doVerify() {
  if (!P || P.busy || P.done) return;
  const m = P.method; let url, body;
  if (m === 'upi') {
    const elUtr = $('#utr');
    const rawUtr = elUtr ? elUtr.value : P.utr;
    const utr = (rawUtr || '').replace(/\D/g, '');
    P.utr = utr;
    if (utr.length !== 12) { P.err = 'Enter the 12-digit UTR from your payment app.'; H.err(); return renderPay(); }
    url = '/api/payment/verify-upi'; body = { plan_key: P.plan.key, utr };
  } else {
    const elTx = $('#txh');
    const tx = ((elTx ? elTx.value : P.tx) || '').trim();
    P.tx = tx;
    if (!/^0x[0-9a-fA-F]{64}$/.test(tx)) { P.err = 'Enter a valid transaction hash (0x + 64 characters).'; H.err(); return renderPay(); }
    url = '/api/payment/verify-usdt'; body = { plan_key: P.plan.key, tx_hash: tx };
  }
  P.busy = true; P.err = ''; renderPay();
  if (tg) tg.MainButton.showProgress && tg.MainButton.showProgress();
  const r = await api(url, body, 35000);
  if (tg) tg.MainButton.hideProgress && tg.MainButton.hideProgress();
  if (!P) return;
  P.busy = false;
  if (r._ok && r.status === 'ok') { P.done = r.expires_at; H.ok(); mb.hide(); U.history = null; renderPay(); confetti(); loadState(); }
  else { P.err = r.error || 'Verification failed.'; H.err(); renderPay(); }
}
function confetti() {
  const cols = ['#00E5A8', '#00B4D8', '#38BDF8', '#10B981', '#F59E0B', '#F8FAFC'];
  for (let n = 0; n < 50; n++) {
    const e = document.createElement('i'); e.className = 'cf'; e.style.left = Math.random() * 100 + 'vw';
    e.style.background = cols[n % cols.length]; e.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
    e.style.animationDelay = Math.random() * .4 + 's'; document.body.appendChild(e);
    setTimeout(() => e.remove(), 3800);
  }
}

function toggleFaq(n) {
  U.faq = U.faq === n ? -1 : n;
  H.light();
  renderProfile();
}
function openSupport() {
  const url = 'https://t.me/' + ((S && S.support) || 'support');
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}
async function loadHistory() { const r = await api('/api/payments'); U.history = r._ok ? r.payments : []; if (U.tab === 'profile') renderProfile(); }
function renderProfile() {
  const u = S.user, st = S.status, active = st.status === 'active';
  const av = u.photo_url ? `<img src="${esc(u.photo_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const hist = U.history === null ? `<div style="text-align:center;padding:18px">${ghostLoaderHtml('Loading history...')}</div>` : U.history.length === 0 ? '<p class="mut" style="font-size:13px;margin:6px 0 0">No payments yet.</p>' : U.history.map(h => { const p = planBy(h.plan_key); const cls = h.status === 'success' ? 'pill-ok' : h.status === 'rejected' ? 'pill-bad' : 'pill-warn'; return `<div class="flex items-center justify-between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><div style="font-weight:700;font-size:14px">${esc(p ? p.name : h.plan_key)}</div><div class="mut" style="font-size:11.5px;margin-top:2px">${esc(h.method.toUpperCase())} · ${esc(fmtDate(h.created_at))}</div></div><div style="text-align:right"><div class="mono" style="font-weight:700;font-size:14px">${h.currency === 'INR' ? '₹' + Number(h.amount).toLocaleString('en-IN') : Number(h.amount) + ' USDT'}</div><span class="pill ${cls}" style="margin-top:3px">${esc(h.status.toUpperCase())}</span></div></div>`; }).join('');
  $('#tab-profile').innerHTML = `
  <div class="glass pad" style="text-align:center"><div style="width:76px;height:76px;border-radius:50%;background:var(--grad);color:var(--acc-txt);display:grid;place-items:center;margin:0 auto;font-size:30px;font-weight:800;overflow:hidden;position:relative"><span style="position:absolute">${esc((u.first_name || 'G')[0].toUpperCase())}</span>${av ? `<div style="position:absolute;inset:0">${av}</div>` : ''}</div>
    <h2 style="font-size:20px;font-weight:800;margin:12px 0 2px">${esc(u.first_name || 'Ghost User')}</h2><div class="mut mono" style="font-size:12px">ID ${u.id}${u.username ? ' · @' + esc(u.username) : ''}</div>
    <div class="flex items-center justify-center gap-2 mt-3"><span class="pill ${active ? 'pill-ok' : 'pill-bad'}">${esc(TIER[active ? st.plan : 'none'])}</span><span class="mut" style="font-size:12.5px">${active ? 'Expires ' + esc(fmtDate(st.expires_at)) : st.status === 'expired' ? 'Expired ' + esc(fmtDate(st.expires_at)) : 'No active plan'}</span></div></div>
  <div class="glass pad mt-3"><p class="lbl">Payment history</p>${hist}</div>
  <div class="glass pad mt-3"><p class="lbl">FAQ</p>${FAQ.map((f, n) => `<div class="faq ${U.faq === n ? 'on' : ''}"><button type="button" onclick="toggleFaq(${n})"><span>${esc(f[0])}</span>${ic('chev', 'w-4 h-4')}</button><div class="a">${esc(f[1])}</div></div>`).join('')}</div>
  <button type="button" class="btn btn-p mt-3" onclick="openSupport()">Contact Support</button>`;
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ph') U.wiz.phone = t.value;
  else if (t.id === 'cd') { U.wiz.code = t.value.replace(/\D/g, ''); t.value = U.wiz.code; if (U.wiz.code.length === 5 && !U.wiz.busy) verifyCode(); }
  else if (t.id === 'pw') U.wiz.pw = t.value;
  else if (t.id === 'dr') { ensureDraft().default_reply = t.value; ensureDraft().template = 'custom'; markDirty(); }
  else if (t.dataset && t.dataset.rk !== undefined) { ensureDraft().keyword_rules[+t.dataset.rk].keyword = t.value; markDirty(); }
  else if (t.dataset && t.dataset.rr !== undefined) { ensureDraft().keyword_rules[+t.dataset.rr].reply = t.value; markDirty(); }
  else if (t.id === 'utr' && P) { P.utr = t.value.replace(/\D/g, ''); t.value = P.utr; }
  else if (t.id === 'txh' && P) P.tx = t.value.trim();
});
document.addEventListener('change', e => { if (e.target.id === 'cc') U.wiz.cc = e.target.value; });

(async function () {
  if (!INIT) return showFatal('');
  const q = new URLSearchParams(location.search).get('tab');
  if (['home', 'ghost', 'plans', 'profile'].includes(q)) U.tab = q;
  if (await loadState()) go(U.tab);
})();
</script>
</body>
