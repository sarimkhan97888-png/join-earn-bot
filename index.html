<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<title>Profitix Ghost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#070B14;--card:#0F1623;--line:rgba(255,255,255,.08);--txt:#F8FAFC;--mut:#94A3B8;--ind:#6366F1;--vio:#8B5CF6;--cyan:#38BDF8;--em:#10B981;--rose:#F43F5E;--amber:#F59E0B;--grad:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.mono{font-family:'JetBrains Mono',monospace}
#aurora{position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgba(99,102,241,.14),transparent 70%),radial-gradient(35% 30% at 85% 30%,rgba(56,189,248,.08),transparent 70%),radial-gradient(40% 35% at 50% 95%,rgba(139,92,246,.12),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.pad{padding:16px}
.mut{color:var(--mut)}
.tab{display:none;animation:fade .35s ease both}.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#fff;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.5;pointer-events:none}
.btn-p{background:var(--grad);box-shadow:0 8px 24px rgba(99,102,241,.35)}
.btn-g{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn-d{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#FDA4AF}
.btn-s{width:auto;padding:9px 14px;font-size:13px;border-radius:11px}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--txt);font:500 15px 'Plus Jakarta Sans',sans-serif;outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--ind);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
select.inp{appearance:none}
textarea.inp{resize:none;min-height:88px;line-height:1.5}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:600 13px 'Plus Jakarta Sans';color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(99,102,241,.35)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 10px 'Plus Jakarta Sans';letter-spacing:.06em}
.pill-pro{background:rgba(139,92,246,.18);color:#C4B5FD;border:1px solid rgba(139,92,246,.4)}
.pill-ok{background:rgba(16,185,129,.14);color:#6EE7B7;border:1px solid rgba(16,185,129,.35)}
.pill-bad{background:rgba(244,63,94,.12);color:#FDA4AF;border:1px solid rgba(244,63,94,.3)}
.pill-warn{background:rgba(245,158,11,.14);color:#FCD34D;border:1px solid rgba(245,158,11,.35)}
.dot{width:10px;height:10px;border-radius:50%;position:relative;background:var(--mut)}
.dot.on{background:var(--em)}.dot.on::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--em);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.8);opacity:0}}
.sw{width:58px;height:32px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;border:0;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--em);box-shadow:0 0 18px rgba(16,185,129,.45)}.sw.on::after{transform:translateX(26px)}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 8px;border-radius:10px;font:700 13px 'Plus Jakarta Sans';cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
#nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,26rem);display:flex;padding:7px;gap:4px;border-radius:22px;background:rgba(15,22,35,.82);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:30}
#nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 0 7px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10.5px 'Plus Jakarta Sans';cursor:pointer;transition:all .25s}
#nav button.on{color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(99,102,241,.4)}
.bd{position:fixed;inset:0;background:rgba(2,6,14,.62);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}.bd.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:28rem;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);z-index:50;background:rgba(15,22,35,.97);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.price-card{position:relative;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s}
.price-card:active{transform:scale(.985)}
.price-card.pro{border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:0 12px 40px rgba(99,102,241,.25)}
.badge{position:absolute;top:-11px;right:16px;padding:5px 11px;border-radius:999px;font:800 10px 'Plus Jakarta Sans';letter-spacing:.06em;color:#fff;background:var(--grad);box-shadow:0 4px 14px rgba(99,102,241,.5)}
.badge.save{right:auto;left:16px;background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.4)}
.shine{position:relative;overflow:hidden}.shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.feat{display:flex;gap:9px;align-items:center;font-size:13px;color:#CBD5E1;margin:7px 0}
.feat svg{color:var(--em);flex:none}.feat.no{color:#64748B;text-decoration:line-through}.feat.no svg{color:#64748B}
.qr{background:#fff;border-radius:16px;padding:10px;width:176px;height:176px;margin:0 auto}.qr img{width:100%;height:100%;display:block}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--ind);animation:rot .8s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:78px;height:78px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 0 50px rgba(99,102,241,.6)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);background:rgba(15,22,35,.95);border:1px solid var(--line);padding:11px 16px;border-radius:14px;font:600 13px 'Plus Jakarta Sans';z-index:80;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:90vw;text-align:center}#toast.on{transform:translate(-50%,0)}
.faq{border-bottom:1px solid var(--line)}.faq:last-child{border:0}
.faq button{width:100%;display:flex;justify-content:space-between;gap:10px;background:none;border:0;color:var(--txt);padding:14px 0;font:600 14px 'Plus Jakarta Sans';text-align:left;cursor:pointer}
.faq .a{max-height:0;overflow:hidden;color:var(--mut);font-size:13px;line-height:1.6;transition:max-height .3s ease}.faq.on .a{max-height:160px;padding-bottom:14px}.faq.on svg{transform:rotate(180deg)}.faq svg{transition:transform .25s;flex:none}
table.mx{width:100%;border-collapse:collapse;font-size:12.5px}table.mx td,table.mx th{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line)}table.mx td:first-child,table.mx th:first-child{text-align:left;color:#CBD5E1}table.mx tr:last-child td{border:0}
.lbl{font:700 11px 'Plus Jakarta Sans';letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin:0 0 8px}
.err{color:#FDA4AF;font-size:13px;margin-top:10px;line-height:1.5}
.hide{display:none!important}
</style>
</head>
<body>
<div id="aurora"></div>
<div id="toast"></div>
<main id="app" class="mx-auto px-4 pt-5" style="max-width:28rem;padding-bottom:130px;padding-top:calc(20px + env(safe-area-inset-top))">
  <section id="tab-home" class="tab on"></section>
  <section id="tab-ghost" class="tab"></section>
  <section id="tab-plans" class="tab"></section>
  <section id="tab-profile" class="tab"></section>
  <section id="boot" class="glass pad" style="text-align:center;margin-top:30vh"><div class="spin"></div><p class="mut" style="margin-top:16px;font-size:14px">Loading your Ghost...</p></section>
</main>
<nav id="nav" class="hide"></nav>
<div id="bd" class="bd"></div>
<div id="sheet" class="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
/* ===================== Telegram + helpers ===================== */
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = (tg && tg.initData) || '';
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#070B14'); tg.setBackgroundColor('#070B14'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const H = {
  light: () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  sel: () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} },
  ok: () => { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
  err: () => { try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',
  ghost: '<path d="M12 2a7 7 0 0 0-7 7v12l3-2 2 2 2-2 2 2 2-2 3 2V9a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="1"/><circle cx="14.5" cy="10" r="1"/>',
  plans: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  check: '<path d="M5 13l4 4L19 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  chev: '<path d="M6 9l6 6 6-6"/>', bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  tg: '<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/>', wa: '<path d="M21 12a9 9 0 1 1-4-7.5L21 4l-1.5 4A9 9 0 0 1 21 12z"/>',
  hook: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  star: '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.2 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/>'
};
const ic = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800); }
async function api(path, body) {
  const o = { headers: { 'X-Telegram-Init-Data': INIT } };
  if (body !== undefined) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  let r; try { r = await fetch(path, o); } catch (e) { return { status: 'error', error: 'Network error. Check your connection.', _ok: false }; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  j._ok = r.ok; return j;
}
function copy(text, label) {
  const done = () => { H.ok(); toast((label || 'Copied') + ' copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fb());
  else fb();
  function fb() { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed'); } a.remove(); }
}
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const TIER = { trial: '1-DAY TRIAL', starter: 'STARTER', pro: 'PRO', none: 'FREE' };
const mb = {
  fn: null,
  set(t, f) { if (!tg) return; this.hide(); this.fn = f; tg.MainButton.setParams({ text: t, color: '#6366F1', text_color: '#ffffff' }); tg.MainButton.onClick(f); tg.MainButton.show(); },
  hide() { if (!tg) return; if (this.fn) tg.MainButton.offClick(this.fn); this.fn = null; tg.MainButton.hide(); }
};

/* ===================== State ===================== */
let S = null;
const U = { tab: 'home', platform: 'telegram', billing: 'monthly', draft: null, dirty: false, history: null, faq: -1,
  wiz: { step: 'phone', cc: '+91', phone: '', code: '', pw: '', full: '', err: '', busy: false, resend: 0 } };
let P = null, endTs = 0, wizTimer = null;
const COUNTRIES = [['🇮🇳 India', '+91'], ['🇺🇸 USA / Canada', '+1'], ['🇬🇧 UK', '+44'], ['🇦🇪 UAE', '+971'], ['🇸🇦 Saudi Arabia', '+966'], ['🇵🇰 Pakistan', '+92'], ['🇧🇩 Bangladesh', '+880'], ['🇳🇵 Nepal', '+977'], ['🇱🇰 Sri Lanka', '+94'], ['🇮🇩 Indonesia', '+62'], ['🇲🇾 Malaysia', '+60'], ['🇸🇬 Singapore', '+65'], ['🇳🇬 Nigeria', '+234'], ['🇿🇦 South Africa', '+27'], ['🇧🇷 Brazil', '+55'], ['🇷🇺 Russia', '+7'], ['🇹🇷 Turkey', '+90'], ['🇩🇪 Germany', '+49'], ['🇫🇷 France', '+33'], ['🇦🇺 Australia', '+61']];
const TEMPLATES = {
  busy: "Hi! I'm busy / away from my phone right now and will get back to you as soon as I can. 🙏",
  hours: "Thanks for your message! Our business hours are 10 AM - 7 PM, Monday to Saturday. I'll reply as soon as we're back.",
  sleep: "I'm sleeping right now 😴 I'll reply when I wake up. If it's urgent, please call me."
};
const FAQ = [
  ['Which code do I enter when connecting?', 'Telegram sends a 5-digit code to your official Telegram app chat (the chat named "Telegram"), not by SMS. Open that chat and type the code here.'],
  ['How does the ₹2 trial work?', 'You get 24 hours of Telegram auto-reply for ₹2 via UPI. It can be claimed once per Telegram user, once per payer UPI ID and once per connected Telegram account.'],
  ['My payment is not detected', 'Bank alerts can take 1-2 minutes. Make sure you paid the exact plan amount, typed the correct 12-digit UTR, and for USDT used the BEP20 (BNB Smart Chain) network with the exact amount.'],
  ['Will Ghost spam my contacts?', 'No. It replies once per contact within your cooldown (5m / 15m / 1h), and ignores groups, channels, bots and your own messages.'],
  ['How do I stop or remove it?', 'Use the master switch on Home to pause instantly, or press Disconnect in the Ghost tab to log the session out completely.']
];

async function loadState(keepTab) {
  const r = await api('/api/state');
  if (!r._ok) { showFatal(r.error || 'Could not load your account.'); return false; }
  S = r; endTs = Date.now() + (S.status.seconds_left || 0) * 1000;
  if (!U.dirty) U.draft = null;
  $('#boot').classList.add('hide'); $('#nav').classList.remove('hide');
  if (!keepTab) renderAll(); else renderAll();
  return true;
}
function showFatal(msg) {
  const inTg = !!INIT;
  $('#boot').innerHTML = `<div style="font-size:42px">👻</div><h2 style="font-weight:800;font-size:19px;margin:10px 0 6px">${inTg ? 'Something went wrong' : 'Open inside Telegram'}</h2><p class="mut" style="font-size:14px;line-height:1.6">${esc(inTg ? msg : 'Profitix Ghost is a Telegram Mini App. Open it from the bot using the Open Ghost button.')}</p>${inTg ? '<button class="btn btn-p" style="margin-top:18px" data-act="retry">Try again</button>' : ''}`;
  $('#boot').classList.remove('hide');
}

/* ===================== Navigation ===================== */
const TABS = [['home', 'Home'], ['ghost', 'Ghost'], ['plans', 'Plans'], ['profile', 'Profile']];
function renderNav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${U.tab === k ? 'on' : ''}" data-act="go" data-t="${k}">${ic(k === 'plans' ? 'plans' : k, 'w-5 h-5')}<span>${l}</span></button>`).join('');
}
function go(t) {
  U.tab = t; document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.id === 'tab-' + t));
  renderNav(); renderTab(t); window.scrollTo({ top: 0 });
  if (t === 'ghost' && U.dirty) mb.set('Save Auto-Reply', saveSettings); else if (!P) mb.hide();
  if (t === 'profile' && U.history === null) loadHistory();
}
function renderAll() { renderNav(); renderTab(U.tab); }
function renderTab(t) { ({ home: renderHome, ghost: renderGhost, plans: renderPlans, profile: renderProfile })[t](); }

/* ===================== HOME ===================== */
function cdText() {
  const ms = endTs - Date.now(); if (S.status.status !== 'active' || ms <= 0) return '--';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0');
  return d > 0 ? `${d}d ${p(h)}h ${p(m)}m` : `${p(h)}:${p(m)}:${p(x)}`;
}
function renderHome() {
  const st = S.status, active = st.status === 'active', on = active && S.settings.is_active && S.account;
  const label = on ? 'ONLINE & MONITORING' : 'PAUSED / EXPIRED';
  const sub = !active ? (st.status === 'expired' ? 'Your plan has expired. Resume in one tap.' : 'No active plan yet.') : !S.account ? 'Connect your Telegram account to go live.' : !S.settings.is_active ? 'Auto-reply is switched off.' : 'Replying to your chats 24/7.';
  const a = S.account;
  $('#tab-home').innerHTML = `
  <div class="flex items-center justify-between mb-4"><div><p class="mut" style="font-size:13px;margin:0">Welcome back</p><h1 style="font-size:22px;font-weight:800;margin:2px 0 0">${esc(S.user.first_name || 'Ghost User')} 👻</h1></div><span class="pill ${active ? 'pill-ok' : 'pill-bad'}">${esc(TIER[active ? st.plan : 'none'])}</span></div>
  <div class="glass pad" style="${on ? 'box-shadow:0 0 40px rgba(16,185,129,.12);border-color:rgba(16,185,129,.25)' : ''}">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3"><div class="dot ${on ? 'on' : ''}"></div><div><div class="mono" style="font-size:13px;font-weight:700;color:${on ? 'var(--em)' : '#FCA5A5'}">${label}</div><div class="mut" style="font-size:12.5px;margin-top:3px">${esc(sub)}</div></div></div>
      <button class="sw ${S.settings.is_active && active ? 'on' : ''}" data-act="master" aria-label="Master switch"></button>
    </div>
  </div>
  <div class="glass pad mt-3 flex items-center gap-3">

    <div class="flex items-center gap-2 mt-3" style="padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)"><div style="flex:1;min-width:0"><div class="lbl" style="margin:0 0 2px">Wallet address</div><div class="mono" style="font-size:11px;word-break:break-all">${esc(i.wallet)}</div></div><button class="btn btn-g btn-s" data-act="copy" data-v="${esc(i.wallet)}" data-l="Address">${ic('copy', 'w-4 h-4')} Copy</button></div>
    <p class="lbl" style="margin-top:16px">After sending, paste the TxHash</p><input id="txh" class="inp mono" placeholder="0x..." style="font-size:12px" value="${esc(P.tx)}">`;
  $('#sheetBody').innerHTML = `<div class="flex items-center justify-between mb-3"><div><div style="font-weight:800;font-size:19px">${esc(p.name)}</div><div class="mut" style="font-size:12.5px">${p.days === 1 ? '24 hours' : p.days + ' days'} access</div></div><div style="font-size:24px;font-weight:800">${amt}</div></div>
  <div class="seg mb-4"><button class="${m === 'upi' ? 'on' : ''}" data-act="method" data-m="upi">UPI</button>${usdtOk ? `<button class="${m === 'usdt' ? 'on' : ''}" data-act="method" data-m="usdt">USDT BEP20</button>` : ''}</div>
  ${body}${P.err ? `<div class="err">${esc(P.err)}</div>` : ''}
  <button class="btn btn-p mt-4" data-act="verify" ${i ? '' : 'disabled'}>Verify Payment</button><button class="btn btn-g mt-2" data-act="closesheet">Cancel</button>`;
}
async function doVerify() {
  if (!P || P.busy || P.done) return; const m = P.method; let url, body;
  if (m === 'upi') { const utr = (P.utr || '').replace(/\D/g, ''); if (utr.length !== 12) { P.err = 'Enter the 12-digit UTR from your payment app.'; H.err(); return renderPay(); } url = '/api/payment/verify-upi'; body = { plan_key: P.plan.key, utr }; }
  else { const tx = (P.tx || '').trim(); if (!/^0x[0-9a-fA-F]{64}$/.test(tx)) { P.err = 'Enter a valid transaction hash (0x + 64 characters).'; H.err(); return renderPay(); } url = '/api/payment/verify-usdt'; body = { plan_key: P.plan.key, tx_hash: tx }; }
  P.busy = true; P.err = ''; renderPay(); if (tg) tg.MainButton.showProgress && tg.MainButton.showProgress();
  const r = await api(url, body); if (tg) tg.MainButton.hideProgress && tg.MainButton.hideProgress();
  if (!P) return; P.busy = false;
  if (r._ok && r.status === 'ok') { P.done = r.expires_at; H.ok(); mb.hide(); U.history = null; renderPay(); confetti(); loadState(true); }
  else { P.err = r.error || 'Verification failed.'; H.err(); renderPay(); }
}
function confetti() {
  const cols = ['#6366F1', '#8B5CF6', '#38BDF8', '#10B981', '#F59E0B', '#F8FAFC'];
  for (let n = 0; n < 60; n++) { const e = document.createElement('i'); e.className = 'cf'; e.style.left = Math.random() * 100 + 'vw'; e.style.background = cols[n % cols.length]; e.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; e.style.animationDelay = Math.random() * .5 + 's'; document.body.appendChild(e); setTimeout(() => e.remove(), 4000); }
}

/* ===================== PROFILE ===================== */
async function loadHistory() { const r = await api('/api/payments'); U.history = r._ok ? r.payments : []; if (U.tab === 'profile') renderProfile(); }
function renderProfile() {
  const u = S.user, st = S.status, active = st.status === 'active';
  const av = u.photo_url ? `<img src="${esc(u.photo_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const hist = U.history === null ? '<div style="text-align:center;padding:18px"><div class="spin" style="width:28px;height:28px;border-width:3px"></div></div>' : U.history.length === 0 ? '<p class="mut" style="font-size:13px;margin:6px 0 0">No payments yet.</p>' : U.history.map(h => { const p = planBy(h.plan_key); const cls = h.status === 'success' ? 'pill-ok' : h.status === 'rejected' ? 'pill-bad' : 'pill-warn'; return `<div class="flex items-center justify-between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><div style="font-weight:700;font-size:14px">${esc(p ? p.name : h.plan_key)}</div><div class="mut" style="font-size:11.5px;margin-top:2px">${esc(h.method.toUpperCase())} · ${esc(fmtDate(h.created_at))}</div></div><div style="text-align:right"><div class="mono" style="font-weight:700;font-size:14px">${h.currency === 'INR' ? '₹' + Number(h.amount).toLocaleString('en-IN') : Number(h.amount) + ' USDT'}</div><span class="pill ${cls}" style="margin-top:3px">${esc(h.status.toUpperCase())}</span></div></div>`; }).join('');
  $('#tab-profile').innerHTML = `
  <div class="glass pad" style="text-align:center"><div style="width:76px;height:76px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto;font-size:30px;font-weight:800;box-shadow:0 0 36px rgba(99,102,241,.4);overflow:hidden;position:relative"><span style="position:absolute">${esc((u.first_name || 'G')[0].toUpperCase())}</span>${av ? `<div style="position:absolute;inset:0">${av}</div>` : ''}</div>
    <h2 style="font-size:20px;font-weight:800;margin:12px 0 2px">${esc(u.first_name || 'Ghost User')}</h2><div class="mut mono" style="font-size:12px">ID ${u.id}${u.username ? ' · @' + esc(u.username) : ''}</div>
    <div class="flex items-center justify-center gap-2 mt-3"><span class="pill ${active ? 'pill-ok' : 'pill-bad'}">${esc(TIER[active ? st.plan : 'none'])}</span><span class="mut" style="font-size:12.5px">${active ? 'Expires ' + esc(fmtDate(st.expires_at)) : st.status === 'expired' ? 'Expired ' + esc(fmtDate(st.expires_at)) : 'No active plan'}</span></div></div>
  <div class="glass pad mt-3"><p class="lbl">Payment history</p>${hist}</div>
  <div class="glass pad mt-3"><p class="lbl">FAQ</p>${FAQ.map((f, n) => `<div class="faq ${U.faq === n ? 'on' : ''}"><button data-act="faq" data-n="${n}"><span>${esc(f[0])}</span>${ic('chev', 'w-4 h-4')}</button><div class="a">${esc(f[1])}</div></div>`).join('')}</div>
  <button class="btn btn-p mt-3" data-act="support">Contact Support</button>`;
}

/* ===================== Events ===================== */
const ACTIONS = {
  go: el => { H.sel(); go(el.dataset.t); },
  retry: () => { $('#boot').innerHTML = '<div class="spin"></div>'; loadState(); },
  master: toggleMaster,
  platform: el => { const p = el.dataset.p; H.sel(); if (p !== 'telegram' && !S.features.whatsapp) return openUpgrade(); U.platform = p; renderGhost(); },
  toplans: () => { closeSheet(); go('plans'); },
  closesheet: closeSheet,
  paydone: () => { closeSheet(); go(S.account ? 'home' : 'ghost'); },
  tpl: el => { const d = ensureDraft(), k = el.dataset.k; d.template = k; if (TEMPLATES[k]) d.default_reply = TEMPLATES[k]; H.sel(); markDirty(); renderGhost(); },
  cool: el => { ensureDraft().cooldown_seconds = +el.dataset.c; H.sel(); markDirty(); renderGhost(); },
  addrule: () => { const d = ensureDraft(); if (d.keyword_rules.length >= S.max_rules) { H.err(); toast(S.features.whatsapp ? 'Rule limit reached' : `Starter allows ${S.max_rules} rules. Upgrade to Pro for unlimited.`); return; } d.keyword_rules.push({ keyword: '', reply: '' }); H.light(); markDirty(); renderGhost(); },
  delrule: el => { ensureDraft().keyword_rules.splice(+el.dataset.i, 1); H.light(); markDirty(); renderGhost(); },
  save: saveSettings,
  sendcode: () => sendCode(false),
  resend: () => sendCode(true),
  verifycode: verifyCode, verify2fa: verify2fa,
  editphone: () => { clearInterval(wizTimer); Object.assign(U.wiz, { step: 'phone', err: '', code: '' }); renderGhost(); },
  disconnect: () => { const run = async () => { const r = await api('/api/telegram/disconnect', {}); if (r._ok) { H.ok(); toast('Account disconnected'); await loadState(true); } else toast(r.error || 'Failed'); }; if (tg && tg.showConfirm) tg.showConfirm('Disconnect this Telegram account? Auto-reply will stop.', ok => ok && run()); else if (confirm('Disconnect this account?')) run(); },
  bill: el => { U.billing = el.dataset.b; H.sel(); renderPlans(); },
  pay: el => openPay(el.dataset.k),
  method: el => { if (!P) return; P.method = el.dataset.m; P.err = ''; H.sel(); renderPay(); loadPayInfo(); },
  verify: doVerify,
  copy: el => copy(el.dataset.v, el.dataset.l),
  faq: el => { const n = +el.dataset.n; U.faq = U.faq === n ? -1 : n; H.light(); renderProfile(); },
  support: () => { const url = 'https://t.me/' + S.support; if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; if (el.tagName === 'A') { H.light(); return; } const f = ACTIONS[el.dataset.act]; if (f) f(el); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ph') U.wiz.phone = t.value; else if (t.id === 'cd') { U.wiz.code = t.value.replace(/\D/g, ''); t.value = U.wiz.code; if (U.wiz.code.length === 5 && !U.wiz.busy) verifyCode(); }
  else if (t.id === 'pw') U.wiz.pw = t.value;
  else if (t.id === 'dr') { ensureDraft().default_reply = t.value; ensureDraft().template = 'custom'; markDirty(); }
  else if (t.dataset && t.dataset.rk !== undefined) { ensureDraft().keyword_rules[+t.dataset.rk].keyword = t.value; markDirty(); }
  else if (t.dataset && t.dataset.rr !== undefined) { ensureDraft().keyword_rules[+t.dataset.rr].reply = t.value; markDirty(); }
  else if (t.id === 'utr' && P) { P.utr = t.value.replace(/\D/g, ''); t.value = P.utr; }
  else if (t.id === 'txh' && P) P.tx = t.value.trim();
});
document.addEventListener('change', e => { if (e.target.id === 'cc') U.wiz.cc = e.target.value; });
$('#bd').addEventListener('click', closeSheet);

/* ===================== Boot ===================== */
(async function () {
  if (!INIT) return showFatal('');
  const q = new URLSearchParams(location.search).get('tab'); if (['home', 'ghost', 'plans', 'profile'].includes(q)) U.tab = q;
  if (await loadState()) go(U.tab);
})();
</script>
</body>
